    <circle cx="200" cy="240" r="32" fill="#1C1819"/>
    <circle cx="200" cy="240" r="18" fill="#C59B27"/>
    <circle cx="200" cy="240" r="8" fill="#FFF"/>
    <circle cx="430" cy="240" r="32" fill="#1C1819"/>
    <circle cx="430" cy="240" r="18" fill="#C59B27"/>
    <circle cx="430" cy="240" r="8" fill="#FFF"/>
