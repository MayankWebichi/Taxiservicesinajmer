      <stop offset="0%" stop-color="#7A1426" />
      <stop offset="100%" stop-color="#3E0611" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8F0" />
      <stop offset="100%" stop-color="#F4ECE1" />
    </linearGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="140%">
