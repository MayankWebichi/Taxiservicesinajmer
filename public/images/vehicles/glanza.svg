    <path d="M260 150 L350 150 L350 178 L260 178 Z" fill="#D6E4EE" opacity="0.9"/>
    <path d="M358 150 L405 178 L358 178 Z" fill="#B0C8DA" opacity="0.85"/>
    <path d="M252 150 L195 175 L252 175 Z" fill="#B0C8DA" opacity="0.85"/>
