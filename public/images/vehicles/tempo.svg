      <stop offset="0%" stop-color="#4F0E1C" />
      <stop offset="100%" stop-color="#240409" />
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" />
