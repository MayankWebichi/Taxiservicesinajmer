    <rect x="240" y="105" width="65" height="50" rx="4" fill="#D6E4EE" opacity="0.9"/>
    <rect x="165" y="105" width="65" height="50" rx="4" fill="#D6E4EE" opacity="0.9"/>
    <rect x="95" y="105" width="60" height="50" rx="4" fill="#B0C8DA" opacity="0.85"/>
