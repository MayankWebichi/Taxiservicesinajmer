  <text x="300" y="315" font-family="'Marcellus', serif" font-size="20" font-weight="bold" fill="#5A0C1A" text-anchor="middle">Force Tempo Traveller (12/17 Seater)</text>
  <text x="300" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#66585C" text-anchor="middle">12-17 Seats • 8+ Luggage • Reclining Seats • Starting @ ₹24/km</text>
