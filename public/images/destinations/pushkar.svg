<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyPushkar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F1622" />
      <stop offset="50%" stop-color="#8C3D2B" />
      <stop offset="100%" stop-color="#E8A852" />
    </linearGradient>
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3D59" />
      <stop offset="100%" stop-color="#17252A" />
    </linearGradient>
    <linearGradient id="templeRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#8E0000" />
    </linearGradient>
  </defs>
  <rect width="600" height="260" fill="url(#skyPushkar)"/>
  <!-- Sun -->
  <circle cx="300" cy="180" r="45" fill="#FFE082" opacity="0.9"/>
  <!-- Hills in background -->
  <path d="M0 240 Q100 160 220 220 T440 210 Q520 170 600 240 L600 260 L0 260 Z" fill="#421C16" opacity="0.6"/>
  <!-- Brahma Temple Shikhara & Red Spire -->
  <polygon points="300,70 280,180 320,180" fill="url(#templeRed)"/>
  <!-- Red Flag -->
  <polygon points="300,70 300,55 330,62.5" fill="#FFC107"/>
  <rect x="260" y="180" width="80" height="50" fill="#FCF8F0"/>
  <polygon points="250,180 300,140 350,180" fill="#C59B27"/>
  <!-- Ghats Steps -->
  <rect x="0" y="230" width="600" height="10" fill="#E8DDCF"/>
  <rect x="0" y="240" width="600" height="10" fill="#D6C5B3"/>
  <rect x="0" y="250" width="600" height="10" fill="#C4B09C"/>
  <!-- Pushkar Lake Water -->
  <rect x="0" y="260" width="600" height="140" fill="url(#lakeWater)"/>
  <!-- Water reflections -->
  <ellipse cx="300" cy="285" rx="50" ry="4" fill="#FFE082" opacity="0.4"/>
  <ellipse cx="300" cy="305" rx="35" ry="3" fill="#FFE082" opacity="0.3"/>
  <!-- Caption Box -->
  <rect x="0" y="330" width="600" height="70" fill="#FCF8F0"/>
  <text x="300" y="365" font-family="'Marcellus', serif" font-size="22" font-weight="bold" fill="#5A0C1A" text-anchor="middle">Pushkar Brahma Temple &amp; Lake</text>
  <text x="300" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#66585C" text-anchor="middle">Sacred Lake Ghats &amp; Ancient Shrines • 14 km from Ajmer</text>
</svg>
