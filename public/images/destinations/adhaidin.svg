<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyAdhai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D0813" />
      <stop offset="70%" stop-color="#73192B" />
      <stop offset="100%" stop-color="#D9A066" />
    </linearGradient>
    <linearGradient id="sandstone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEB887" />
      <stop offset="100%" stop-color="#A07240" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyAdhai)"/>
  <!-- Grand 7-Arched Screen Wall -->
  <rect x="60" y="140" width="480" height="190" fill="url(#sandstone)"/>
  <!-- Center Main Tall Arch -->
  <path d="M260 330 L260 210 Q300 150 340 210 L340 330 Z" fill="#240409"/>
  <path d="M250 210 Q300 135 350 210" fill="none" stroke="#C59B27" stroke-width="4"/>
  <!-- Left Arches -->
  <path d="M190 330 L190 230 Q220 180 250 230 L250 330 Z" fill="#240409"/>
  <path d="M120 330 L120 245 Q145 200 170 245 L170 330 Z" fill="#240409"/>
  <path d="M65 330 L65 260 Q85 220 105 260 L105 330 Z" fill="#240409"/>
  <!-- Right Arches -->
  <path d="M350 330 L350 230 Q380 180 410 230 L410 330 Z" fill="#240409"/>
  <path d="M430 330 L430 245 Q455 200 480 245 L480 330 Z" fill="#240409"/>
  <path d="M495 330 L495 260 Q515 220 535 260 L535 330 Z" fill="#240409"/>
  <!-- Islamic Geometric Screen Cornice -->
  <rect x="50" y="130" width="500" height="15" fill="#C59B27"/>
  <!-- Caption Box -->
  <rect x="0" y="330" width="600" height="70" fill="#FCF8F0"/>
  <text x="300" y="365" font-family="'Marcellus', serif" font-size="22" font-weight="bold" fill="#5A0C1A" text-anchor="middle">Adhai Din Ka Jhopra</text>
  <text x="300" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#66585C" text-anchor="middle">12th-Century Indo-Islamic Arched Monument • 3 km from Station</text>
</svg>
