<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyKishan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3B6F" />
      <stop offset="60%" stop-color="#4A7BB0" />
      <stop offset="100%" stop-color="#9BC1BC" />
    </linearGradient>
    <linearGradient id="snowWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cyanWater" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#0081CF" />
    </linearGradient>
  </defs>
  <rect width="600" height="200" fill="url(#skyKishan)"/>
  <!-- Bright Sun -->
  <circle cx="120" cy="80" r="30" fill="#FFF" opacity="0.9"/>
  <!-- Marble Slurry Snow Dunes -->
  <path d="M0 240 Q120 160 260 210 Q380 140 500 190 L600 170 L600 400 L0 400 Z" fill="url(#snowWhite)"/>
  <path d="M0 280 Q180 210 320 250 Q460 220 600 240 L600 400 L0 400 Z" fill="#F8FAFC"/>
  <!-- Turquoise Pool in Dumping yard -->
  <ellipse cx="380" cy="290" rx="140" ry="25" fill="url(#cyanWater)" opacity="0.85"/>
  <!-- Taxi car parked at scenic photography spot -->
  <rect x="140" y="240" width="80" height="30" rx="4" fill="#5A0C1A"/>
  <rect x="155" y="225" width="45" height="16" rx="3" fill="#333"/>
  <circle cx="155" cy="270" r="10" fill="#1C1819"/>
  <circle cx="205" cy="270" r="10" fill="#1C1819"/>
  <!-- Caption Box -->
  <rect x="0" y="330" width="600" height="70" fill="#FCF8F0"/>
  <text x="300" y="365" font-family="'Marcellus', serif" font-size="22" font-weight="bold" fill="#5A0C1A" text-anchor="middle">Kishangarh Dumping Yard</text>
  <text x="300" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#66585C" text-anchor="middle">"The Switzerland of Rajasthan" • White Marble Slurry &amp; Airport Hub</text>
</svg>
